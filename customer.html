<!DOCTYPE html>
<html lang="en">

  <title>My Account - BorrowBox</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="customer">

  <nav class="navbar" id="navbar-mount"></nav>

  <main class="container">

    <div class="list-card mb-16">

        <h4>Profile</h4>
        <div class="meta">Email: <span id="customer-email"></span></div>

    <h3 class="section-title">My Purchases &amp; Rentals</h3>
    <div id="customer-transactions">
      <div class="empty-state">Loading...</div>
    </div>

  <footer>
    &copy; 2026 BorrowBox - a college project MVP.
  </footer>

  <script src="app.js"></script>
